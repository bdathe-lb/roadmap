<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS-Roadmap</title>
  <meta name="description" content="2026-09 到 2027-09 的求职路线图：C++ 后端主线、算法线、AI 支线，按时间线展开阶段目标与通关条件。">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231b1d22'/%3E%3Crect x='3' y='4' width='6' height='2' fill='%23e3a42f'/%3E%3Crect x='6' y='7' width='7' height='2' fill='%2345b5cf'/%3E%3Crect x='3' y='10' width='9' height='2' fill='%23a58be6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <div class="top-title">
      <h1>CS-Roadmap</h1>
      <p>C++ 后端求职路线，2026-09 → 2027-09</p>
    </div>
    <div class="top-stats">
      <div class="stat"><span>距投递</span><b id="d1">—</b><em>天</em></div>
      <div class="stat"><span>距秋招</span><b id="d2">—</b><em>天</em></div>
      <div class="stat stat-prog">
        <span>已完成</span><b id="donen">0</b><em>/ <i id="totaln">0</i></em>
        <div class="meter" aria-hidden="true"><div id="donebar"></div></div>
      </div>
    </div>
  </header>

  <main>
    <section class="sec" aria-labelledby="h-now">
      <div class="sec-head">
        <h2 id="h-now">现在</h2>
        <span class="sec-sub" id="today"></span>
      </div>
      <div class="now" id="now"></div>
      <div class="next" id="next"></div>
    </section>

    <section class="sec sec-tl" aria-labelledby="h-tl">
      <div class="sec-head">
        <h2 id="h-tl">时间线</h2>
        <div class="legend" aria-hidden="true">
          <span><i class="lg-main"></i>主线</span>
          <span><i class="lg-algo"></i>算法</span>
          <span><i class="lg-ai"></i>AI 支线</span>
          <span><i class="lg-today"></i>今天</span>
        </div>
      </div>
      <div class="tl-wrap"><div class="tl" id="tl"></div></div>
    </section>

    <section class="sec" aria-labelledby="h-all">
      <div class="sec-head">
        <h2 id="h-all">全部关卡</h2>
        <span class="sec-sub">按阶段排列，点击查看详情</span>
      </div>
      <div id="phases"></div>
    </section>
  </main>

  <footer class="foot">
    <span class="sync" id="sync" role="button" tabindex="0" title="点击设置写入口令"></span>
    <button id="reset" type="button">重置进度</button>
  </footer>

  <dialog id="dlg" aria-labelledby="dlg-title"><div class="card" id="card" tabindex="-1"></div></dialog>
  <script src="assets/app.js"></script>
</body>
</html>
